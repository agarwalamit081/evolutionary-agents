# Shared config for all turing agent roles (api/worker/agent-cli). Same image,
# same env (internal service hostnames + persisted workspace), same network.
# Each role overrides only `command` (+ ports/replicas). Factored out so the
# Phase-3 role-split stays DRY and the three services never drift on env.
x-agent-common: &agent-common
  build:
    context: .
    dockerfile: Dockerfile
  # Named tag (S9) so `docker images` shows it instead of an opaque auto-name,
  # and scripts/push-images.sh can push it to the local registry. Covers api +
  # worker + agent-cli, which all build from this one image.
  image: self-evolving-agent:latest
  env_file: .env
  environment:
    # Internal service hostnames (override the localhost defaults in .env) +
    # persisted workspace/logs so deliverables survive container restarts.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/turing_agent
    REDIS_URL: redis://redis:6379/0
    SEARXNG_URL: http://searxng:8080
    MEILISEARCH_URL: http://meilisearch:7700
    MEILISEARCH_KEY: ${MEILISEARCH_KEY:-}
    WORKSPACE_ROOT: /home/turing/.turing/workspace
    RESULTS_ROOT: /home/turing/.turing/results
    # Promoted-prompt artifacts (PromotionGate current.json + versioned prompts)
    # on the SHARED turing-workspace volume so the optimizer sidecar's promotions
    # reach api/worker (builder.splice_evolved). The .env default ".turing/evolved"
    # is RELATIVE → resolves container-local (/app/.turing/evolved), invisible
    # across containers; forcing it absolute here mirrors WORKSPACE/RESULTS_ROOT
    # and is required for the optimizer's promotions to take effect.
    EVOLVED_HANDLERS_DIR: /home/turing/.turing/evolved
    # Phase 3b/c no-DinD: every code-exec role routes generated code through the
    # remote runner (the worker has NO Docker socket). Forced here — it OVERRIDES
    # .env — precisely because the container topology has no socket: letting .env
    # select docker mode would silently fall back to a host subprocess and defeat
    # the isolation goal. Host runs (`python main.py`) keep honoring whatever
    # CODE_EXECUTOR_MODE / EVOLUTION_SANDBOX_MODE .env sets (default: subprocess).
    CODE_EXECUTOR_MODE: runner
    EVOLUTION_SANDBOX_MODE: runner
    RUNNER_URL: http://runner:8090
    # #2 generated-tool isolation default: mark every role that runs the agent
    # graph (api/worker) as a worker process so isolation engages by default
    # EVEN IF a role lands in subprocess mode (stale image / operator override),
    # auto-promoting to the runner surface (fail-closed if down). Harmless for
    # the runner role — it executes submitted code, never invokes generated
    # tools. Overrides .env so the container topology is authoritative.
    TURING_WORKER_PROCESS: "1"
    # Replicated workers (deploy.replicas: 2 below) MUST each own a UNIQUE Redis
    # consumer name or they share one pending-entries list and break XAUTOCLAIM
    # crash-recovery. Forcing WORKER_CONSUMER_NAME empty here makes every worker
    # auto-derive worker-{hostname}-{pid} regardless of what .env sets — the
    # canonic example-config default (worker-1) would otherwise make BOTH
    # replicas collide on it. Harmless for the api/agent roles (they don't read
    # it). See src/worker/__main__.py:_resolve_consumer_name.
    WORKER_CONSUMER_NAME: ""
    # Observability (Track B). The metrics recorder call sites fire UNCONDITIONALLY
    # (prometheus_client is pinned), so forcing PROMETHEUS_ENABLED=true only starts
    # the per-process :9100 scrape server (worker/scheduler/optimizer via
    # init_process_observability) — a near-zero-cost background thread that makes
    # the `observability` profile's Prometheus scrape data out-of-the-box. The api
    # exposes /metrics as a route (create_app) and ignores this flag. OTEL_ENDPOINT
    # is forced at Phoenix so traces flow there WHEN OTEL_ENABLED is flipped on in
    # .env (tracing stays opt-in — it has sampling cost); harmless when off (never
    # read). Overrides .env so the container topology is authoritative (mirrors the
    # CODE_EXECUTOR_MODE / EVOLVED_HANDLERS_DIR forces above).
    PROMETHEUS_ENABLED: "true"
    OTEL_ENDPOINT: http://phoenix:6006
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    searxng:
      condition: service_started
    meilisearch:
      condition: service_healthy
    # Phase 3b/c: code-exec roles route generated code to the runner; waiting for
    # it healthy avoids a first-code-exec host-subprocess fallback at startup.
    runner:
      condition: service_healthy
  volumes:
    - turing-workspace:/home/turing/.turing
    - turing-logs:/home/turing/logs
  networks:
    - turing-net
  restart: unless-stopped
  # Defense-in-depth inherited by every agent role (api/worker/agent-cli). The
  # worker runs LLM-driven code (via the isolated runner), so drop ALL Linux
  # capabilities + block privilege escalation. Per-role resource limits are set
  # on each service below (resource limits can't be shared via the anchor — a
  # service's own `deploy:` would shallow-replace the anchor's).
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: turing_agent
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5433:5432"
    volumes:
      # pg18+ uses version-specific data subdirs; mount the PARENT so future
      # major-version upgrades work via pg_upgrade (docker-library/postgres#1259).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 1024
    security_opt:
      - no-new-privileges:true
    # No cap_drop:ALL here: the postgres official entrypoint chowns/chmods the
    # data dir + /var/run/postgresql as root before gosu→postgres, which needs
    # file-ownership caps (CHOWN/FOWNER/DAC_OVERRIDE). Dropping ALL makes it
    # loop "Operation not permitted" and never come up. no-new-privileges +
    # the resource limit still bound it, and postgres runs no untrusted code,
    # so cap_drop adds no real protection here. (Meili/rootless images DO
    # tolerate cap_drop:ALL; these root-then-gosu images do not.)
    networks:
      - turing-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # --maxmemory lowered 2g→1g so the container mem-limit (1.5g below) sits
    # ABOVE the data cap with real headroom — redis self-limits at 1g (LRU), so
    # it is never OOM-killed and never evicts an unacked turing:runs stream entry
    # (which would lose a pending job). 1g is ample for this app's hot/cache tier.
    command: redis-server --appendonly yes --maxmemory 1g --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1500m
          cpus: "1.0"
          pids: 1024
    security_opt:
      - no-new-privileges:true
    # No cap_drop:ALL here: the redis official entrypoint chowns the AOF/data
    # dir as root before gosu→redis, which needs file-ownership caps (CHOWN/
    # FOWNER/DAC_OVERRIDE). Dropping ALL makes it loop "Permission denied" on
    # ./appendonlydir. no-new-privileges + the resource limit bound it; redis
    # executes no untrusted code so cap_drop adds no real protection. See the
    # matching note on the postgres service for the same root-then-gosu reason.
    networks:
      - turing-net
    restart: unless-stopped

  searxng:
    # Primary keyless live-search service (Phase 1). JSON API enabled + bot
    # limiter disabled in the mounted settings.yml so the agent can call
    # /search?format=json over the internal network without keys.
    # NOTE: the service still listens on 8080 INSIDE the container (the
    # in-container agent reaches it at http://searxng:8080); the HOST port is
    # mapped to 8081 so this stack never clashes with SearXNG containers other
    # projects may run on the default 8080.
    # Pinned by immutable digest (not :latest): SearXNG publishes only rolling
    # :latest + weekly date tags, so a tag still floats. The digest freezes the
    # EXACT image already pulled locally (no re-pull, no behavior change). Bump
    # intentionally by pulling a new digest + updating this string.
    image: searxng/searxng@sha256:754a07a64e926a1fc0a8a30cd7a07d08278188f0ef6143e38ad0b22ea8599c55
    ports:
      - "8081:8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
          pids: 1024
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - turing-net
    restart: unless-stopped

  meilisearch:
    # Corpus keyword/hybrid index (Phase 1). BM25 + filterable attrs; the
    # agent's corpus_search fuses these hits with pgvector semantic hits via
    # Reciprocal Rank Fusion. Master key from .env (MEILISEARCH_KEY).
    # NOTE: the service listens on 7700 INSIDE the container (the in-container
    # agent reaches it at http://meilisearch:7700); the HOST port is mapped to
    # 7701 so this stack never clashes with Meilisearch containers other
    # projects may run on the default 7700.
    image: getmeili/meilisearch:v1.12
    command: ["meilisearch", "--http-addr", "0.0.0.0:7700"]
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      # Empty/unset MEILISEARCH_KEY → no master key → keyless dev (matches the
      # agent's empty default). Production sets MEILISEARCH_KEY (>=16 bytes) in
      # .env; Meili then requires it and the agent sends the same value.
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7701:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - turing-net
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 1024
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # ─── Phase 3 role-split ───────────────────────────────────────────────
  # Stateless roles scale; stateful services (postgres/redis/searxng/meili)
  # don't. `api` (FastAPI ingress) enqueues RunJobs to the turing:runs stream;
  # `worker`(s) drain it via the consumer group and run the LangGraph + evolution
  # loop. Both reuse the single Dockerfile image, differing only in `command`.
  api:
    <<: *agent-common
    # uvicorn factory (src/api/app.py:create_app). The Dockerfile CMD (CLI) is
    # stale for the API role; run the server directly.
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "src.api.app:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    # HOST port 8800 (not the default 8000): 8000 is a magnet for conflicts with
    # other dev apps (another project's API already collided on it during
    # bring-up). The non-default host port matches the stack's pattern
    # (5433/6380/8081/7701 all avoid the canonic port). The container still
    # LISTENS on 8000 internally (uvicorn --port 8000 above); only the HOST side
    # of the mapping is non-8000, so nothing in-container references 8000 as a host.
    ports:
      - "8800:8000"
    healthcheck:
      # Liveness probe against the root-mounted /health route
      # (src/api/routes/health.py). start_period covers uvicorn + app startup
      # (DB pool warm-up) before the first probe; mirrors the runner healthcheck.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
          pids: 512

  worker:
    <<: *agent-common
    # NO container_name: deploy.replicas spawns N containers and a fixed name
    # would collide. Each replica auto-derives a UNIQUE Redis consumer name
    # (worker-{hostname}-{pid}, src/worker/__main__.py) so replicas don't share a
    # pending-entries list — XAUTOCLAIM crash-recovery stays sound at scale.
    command: ["python", "-m", "src.worker"]
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 512
    # Graceful drain: SIGTERM sets the stop flag; an in-flight job finishes +
    # XACKs before the loop exits. A run longer than this grace is hard-killed,
    # which is SAFE — its checkpoint is durable, so the next worker claim
    # resumes from it (thread_id = api-{run_id} is stable across redelivery).
    stop_grace_period: 120s
    volumes:
      # Same persisted workspace/logs as the api (+ agent-cli) so deliverables a
      # worker writes survive restarts and are visible to the api (explicit list
      # replaces the anchor's volumes, so both are re-declared here). The worker
      # no longer mounts docker.sock — generated code now runs in the remote
      # no-DinD runner (Phase 3b/c), reached over turing-runner-net.
      - turing-workspace:/home/turing/.turing
      - turing-logs:/home/turing/logs
    networks:
      # turing-net for postgres/redis/searxng/meili/api; turing-runner-net to
      # reach the no-DinD code-exec runner (worker has NO Docker socket).
      - turing-net
      - turing-runner-net

  # ─── Phase 5 — nightly capability-curve battery feeder (#197) ───────────
  # The missing scheduling layer. No run path is time-triggered today: runs
  # enter turing:runs only via the API or the host CLI --eval, so the capability
  # curve only updates when a human runs --eval. This sidecar, on SCHEDULER_CRON,
  # enqueues every BATTERY04_GOALS spec as a RunJob into turing:runs via the SAME
  # RunsQueue.enqueue seam the API uses — the worker then runs them through the
  # real deployed stack and eval_results populates the curve autonomously.
  #
  # Profile-gated (opt-in): `docker compose --profile scheduler up -d`. The
  # daemon defaults SCHEDULER_ENABLED=false (a bare host run is a clean no-op),
  # so the service forces it true here — mirroring the anchor's forced-topology
  # pattern. LEAST-PRIVILEGE like the runner: Redis ONLY (no DATABASE_URL /
  # search keys / runner URL / env_file) — it never executes code or touches the
  # DB; the worker draining these jobs does the work. Defined STANDALONE (not via
  # the anchor) precisely so it inherits neither .env nor DB/search creds.
  scheduler:
    profiles: ["scheduler"]
    build:
      context: .
      dockerfile: Dockerfile
    image: self-evolving-agent:latest
    command: ["python", "-m", "src.scheduler"]
    # env_file so the Phase-5 I1 cron-consumer knobs (AGENT_CRON_ENABLED /
    # AGENT_CRON_*) + the rest of the app config reach this service at runtime.
    # The scheduler RUNS the cron consumer (src/scheduler/__main__.py), which
    # reads `scheduled_tasks` from the DB → it needs DATABASE_URL + the
    # AGENT_CRON_* knobs the hand-rolled `environment:` below did NOT carry.
    # (The `${SCHEDULER_*}` interpolations already resolve via compose's own
    # .env reading, but pydantic-settings reads AGENT_CRON_* from the CONTAINER
    # env, hence env_file. Mirrors the optimizer sidecar's *agent-common path.)
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/turing_agent
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_ENABLED: "true"
      SCHEDULER_CRON: ${SCHEDULER_CRON:-0 2 * * *}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-UTC}
      SCHEDULER_MODEL: ${SCHEDULER_MODEL:-}
      SCHEDULER_NO_EVOLUTION: ${SCHEDULER_NO_EVOLUTION:-false}
      # 0 = full battery (production nightly curve); 1 = cheap one-spec smoke.
      SCHEDULER_SPEC_LIMIT: ${SCHEDULER_SPEC_LIMIT:-0}
      # Phase 2 C2: the optimizer TRIGGER reads ONLY these four (the sidecar
      # owns the node/backend/eval knobs). OPTIMIZER_ENABLED is the opt-in —
      # bring BOTH profiles up (`--profile scheduler --profile optimizer`) so
      # the scheduler can reach the sidecar to POST /optimize. The node/backend/
      # cost knobs live on the optimizer service (via *agent-common + .env).
      OPTIMIZER_ENABLED: ${OPTIMIZER_ENABLED:-false}
      OPTIMIZER_CRON: ${OPTIMIZER_CRON:-30 3 * * *}
      OPTIMIZER_TIMEZONE: ${OPTIMIZER_TIMEZONE:-UTC}
      OPTIMIZER_URL: ${OPTIMIZER_URL:-http://optimizer:8095}
      # RO rootfs image hygiene (matches the runner): no .pyc writes.
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
          pids: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - turing-net
    restart: unless-stopped

  # ─── Phase 5 I3 — Neo4j entity/relation graph (structured mirror) ──────────
  # Profile-gated (opt-in): bring up with `docker compose --profile graph up -d`.
  # The api/worker mirror STRUCTURED records (sub-agents, skills/procedures/
  # workflows, facts) into this graph on write when GRAPH_ENABLED (NEO4J_URI ->
  # bolt://neo4j:7687 mirrored via .env). NO LLM extraction here — pure structured
  # sync. LEAST-PRIVILEGE: no DATABASE_URL / search / runner creds (it owns no run
  # logic). Best-effort + non-fatal: a down/slow/unreachable Neo4j never aborts a
  # run (the mirror write is caught + logged WARNING), so no healthcheck gate is
  # wired — the first mirror after it is up simply succeeds.
  neo4j:
    profiles: ["graph"]
    image: neo4j:5-community          # 5.x community (free); pin to neo4j:5.26 for reproducibility
    ports:
      # Host ports remapped (17474/17687): the host runs its own Neo4j on the
      # default 7474/7687, which would clash. The api/worker containers connect
      # via the INTERNAL turing-net hostname bolt://neo4j:7687 (container port
      # 7687, unaffected by this host mapping); these host mappings only expose
      # the browser UI / Bolt for host-side inspection.
      - "17474:7474"                  # HTTP browser UI (http://localhost:17474)
      - "17687:7687"                  # Bolt host-side mirror (api/worker use neo4j:7687)
    environment:
      # user/password the container bootstraps; set NEO4J_AUTH=neo4j/<password> in
      # .env and make the api/worker NEO4J_PASSWORD match <password>.
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/turing-graph}
    volumes:
      - neo4jdata:/data
    deploy:
      resources:
        limits:
          memory: 1g                  # JVM heap + page cache for the structured mirror
          cpus: "1.0"
          pids: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # neo4j's entrypoint runs as root, chowns its home + /data on EVERY boot,
    # then drops to the neo4j user (7474) via gosu. The project-wide cap_drop:
    # ALL strips CAP_CHOWN → every chown returns EPERM → exit 1 → restart loop
    # (observed crash-loop on bring-up). Grant ONLY the caps the entrypoint
    # needs (file-ownership + privilege drop). Stays least-privilege in spirit:
    # neo4j owns NO run logic and carries NO DATABASE_URL/search/runner creds
    # (env exposes only NEO4J_AUTH), so these caps let it manage its own files.
    cap_add:
      - CHOWN          # entrypoint chowns /var/lib/neo4j + /data on boot
      - DAC_OVERRIDE   # bypass file perms while walking the tree to chown it
      - FOWNER         # set ownership on files it doesn't currently own
      - SETUID         # entrypoint drops root → neo4j user (7474) via gosu
      - SETGID
    networks:
      - turing-net
    restart: unless-stopped

  # ─── Phase 2 C2 — metric-driven prompt-optimizer sidecar (DSPy + GEPA) ──
  # The IMPROVEMENT loop C1 left out. The scheduler POSTs /optimize (OPTIMIZER_CRON,
  # gated by OPTIMIZER_ENABLED); the optimizer runs DSPy/GEPA against a cheap proxy
  # metric, VALIDATES the candidate against the REAL GoldenCanary (full agent runs,
  # cost-bounded by OPTIMIZER_MAX_COST_USD + C1's capability-curve precondition),
  # and on beating the baseline pushes the prompt through the EXISTING PromotionGate.
  #
  # Profile-gated (opt-in like scheduler): `docker compose --profile optimizer up -d`.
  # Uses *agent-common (NOT least-privilege like the runner/scheduler): it runs the
  # full canary, so it inherits .env (provider keys) + DATABASE_URL/REDIS_URL/search
  # + CODE_EXECUTOR_MODE=runner (the canary's graph may invoke code_executor → it
  # needs turing-runner-net, like the worker) + the shared turing-workspace volume
  # (EVOLVED_HANDLERS_DIR is forced absolute on it above). :8095 is internal-only
  # (no host port) — the scheduler calls http://optimizer:8095/optimize by name.
  # Build needs the base image first: build api/worker (→ self-evolving-agent:latest),
  # then `docker compose --profile optimizer build optimizer`.
  optimizer:
    <<: *agent-common
    profiles: ["optimizer"]
    build:
      context: .
      dockerfile: Dockerfile.optimizer
    image: self-evolving-agent-optimizer:latest
    command: ["python", "-m", "src.optimizer"]
    expose:
      - "8095"   # internal only — NOT mapped to a host port (scheduler reaches it by name)
    healthcheck:
      # Liveness/readiness against GET /healthz (src/optimizer/server.py).
      test:
        [
          "CMD-SHELL",
          "python -c 'import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:8095/healthz\",timeout=2).read()'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 512
    networks:
      # turing-net for postgres/redis/search/api; turing-runner-net so the canary's
      # graph (CODE_EXECUTOR_MODE=runner) reaches the code-exec runner (mirrors worker).
      - turing-net
      - turing-runner-net

  # ─── Phase 3b/c — remote no-DinD code-execution runner (#218/#219) ──────
  # The worker's single sink for generated code: both code_executor (untrusted
  # LLM one-off code) and the evolution sandbox (statically vetted code) POST
  # here over HTTP. The worker needs NO Docker socket (no Docker-in-Docker) — the
  # disposable container itself is the isolation boundary (per-invocation
  # gVisor/Kata hardening is a Phase-5 doc item).
  #
  # LEAST-PRIVILEGE: NO env_file, NO DATABASE_URL / REDIS_URL / search keys — it
  # reads only RUNNER_* env (its results dir + timeout cap). NO internet egress:
  # it lives on the internal-only turing-runner-net. :8090 is exposed to the
  # internal network only (NOT mapped to a host port).
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    image: self-evolving-agent-runner:latest
    environment:
      RUNNER_RESULTS_ROOT: /home/turing/.turing/results
      RUNNER_MAX_TIMEOUT_S: "300"
      # RO rootfs (below): stop Python from trying to write .pyc to /app.
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      # Shared workspace RW so a script's results/<file> writes are visible to the
      # worker and land in the same persisted volume the worker/api read. logs for
      # symmetry. UID ALIGNMENT: both this image and the main Dockerfile create the
      # `turing` user via `useradd -m -r turing` from the same python:3.12-slim
      # base, so they resolve to the SAME uid and shared-volume writes interoperate
      # (a runtime uid-mismatch smoke is a Phase-5 hardening item).
      - turing-workspace:/home/turing/.turing
      - turing-logs:/home/turing/logs
    expose:
      - "8090"   # internal only — NOT mapped to a host port (no egress path)
    # Hardest target — this container EXECUTES untrusted LLM-generated Python,
    # so bound it tight: RO rootfs (writes only hit the writable /tmp tmpfs +
    # the shared results volume), 256 PIDs (fork-bomb cap), 1g mem / 1 cpu,
    # ALL capabilities dropped, no privilege escalation. /tmp is scratch for the
    # executed subprocess (script + tempfile.mkdtemp); the results volume holds
    # deliverables (cwd = results-root parent). read_only is safe because the
    # only rootfs writes would be pyc, suppressed by PYTHONDONTWRITEBYTECODE.
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /run:size=32m
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:8090/health\",timeout=2).read()'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - turing-runner-net
    restart: unless-stopped

  # The CLI-in-container path: one-off / smoke / manual runs via
  # `docker compose --profile cli run --rm agent --goal "..."`. Profile-gated so
  # `docker compose up -d` runs api+worker (the production path), not the
  # interactive monolith. Shares image + env via the anchor.
  agent:
    <<: *agent-common
    profiles: ["cli"]
    networks:
      # CLI smoke runs inherit CODE_EXECUTOR_MODE=runner from the anchor and route
      # code-exec through the runner too, so reach it on turing-runner-net.
      - turing-net
      - turing-runner-net
    # Inherits the Dockerfile CMD (python main.py --interactive); extra args
    # pass through on `docker compose --profile cli run agent --goal "..."`.
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 512

  # Phase 2c — the code_executor sandbox image (NOT a running service). Gated
  # behind the `sandbox` profile so it never starts with the default stack; an
  # operator builds it on demand to opt into CODE_EXECUTOR_MODE=docker:
  #   docker compose --profile sandbox build toolbox
  toolbox:
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: Dockerfile.toolbox
    image: self-evolving-agent-toolbox:latest

  # Local registry (S9) — host-only push target for scripts/push-images.sh so
  # the built images (self-evolving-agent / self-evolving-agent-runner / self-evolving-agent-toolbox) are named,
  # cached, and shareable without depending on an external registry. Exposed to
  # the host on :5001; on turing-net. NOT started by default (gated behind the
  # `registry` profile, like `toolbox`/`sandbox`) — bring it up explicitly:
  #   docker compose --profile registry up -d registry
  registry:
    profiles: ["registry"]
    image: registry:2
    ports:
      - "5001:5000"
    volumes:
      - registrydata:/var/lib/registry
    networks:
      - turing-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ─── Track B — observability backends (metrics + traces) ──────────────────
  # Profile-gated (opt-in): `docker compose --profile observability up -d`.
  # Three SEPARATE backend containers (in-process instrumentation already lives in
  # the app image via #631). Prometheus scrapes api:8000 + worker:9100 over
  # turing-net via dns_sd (no docker.sock); Grafana auto-provisions the Prometheus
  # datasource + the starter dashboard; Phoenix is the OTLP trace backend the app
  # exports to when OTEL_ENABLED is flipped on (.env) — OTEL_ENDPOINT is forced at
  # phoenix:6006 in the anchor above. Each is least-privilege + resource-bounded.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.6.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # Host 9090 (Prometheus's own UI/API port; nothing in THIS stack owns 9090 —
      # app metrics are on 8000/9100, so the 9090 clash the port-rename avoided no
      # longer applies here).
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - turing-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
          pids: 512

  grafana:
    profiles: ["observability"]
    image: grafana/grafana-oss:13.2.0
    volumes:
      # Auto-provisioned datasource + dashboard providers + the dashboard JSON.
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"           # Grafana UI (admin/admin on first boot)
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # local-dev read-only browse without login
    networks:
      - turing-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
          pids: 256

  phoenix:
    profiles: ["observability"]
    # Arize Phoenix — OTLP trace backend. UI + OTLP/HTTP on 6006 (/v1/traces is
    # where the app's OTLPSpanExporter posts), OTLP/gRPC on 4317. SQLite default
    # store on the mounted volume (light — no ClickHouse). Pin to a version tag so
    # the schema/UI don't drift under :latest.
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_HOST: 0.0.0.0
      PHOENIX_PORT: "6006"
      PHOENIX_SQL_DATABASE_URL: sqlite:////mnt/data/phoenix.db
    volumes:
      - phoenixdata:/mnt/data
    ports:
      - "6006:6006"           # Phoenix UI + OTLP/HTTP
    networks:
      - turing-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 512

volumes:
  pgdata:
  redisdata:
  neo4jdata:
  meilidata:
  turing-workspace:
  turing-logs:
  registrydata:
  phoenixdata:
  grafanadata:

networks:
  turing-net:
    driver: bridge
  # Phase 3b/c — runner-only, internal (NO internet egress). Only the worker,
  # agent-cli, and runner attach here; the runner has NO other network, so it is
  # fully egress-isolated from the internet (postgres/redis/searxng/meili stay on
  # turing-net, which the runner is NOT on).
  turing-runner-net:
    driver: bridge
    internal: true
