# Shared config for all turing agent roles (api/worker/agent-cli). Same image,
# same env (internal service hostnames + persisted workspace), same network.
# Each role overrides only `command` (+ ports/replicas). Factored out so the
# Phase-3 role-split stays DRY and the three services never drift on env.
x-agent-common: &agent-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  environment:
    # Internal service hostnames (override the localhost defaults in .env) +
    # persisted workspace/logs so deliverables survive container restarts.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/turing_agent
    REDIS_URL: redis://redis:6379/0
    SEARXNG_URL: http://searxng:8080
    MEILISEARCH_URL: http://meilisearch:7700
    MEILISEARCH_KEY: ${MEILISEARCH_KEY:-}
    WORKSPACE_ROOT: /home/turing/.turing/workspace
    RESULTS_ROOT: /home/turing/.turing/results
    # Phase 3b/c no-DinD: every code-exec role routes generated code through the
    # remote runner (the worker has NO Docker socket). Forced here — it OVERRIDES
    # .env — precisely because the container topology has no socket: letting .env
    # select docker mode would silently fall back to a host subprocess and defeat
    # the isolation goal. Host runs (`python main.py`) keep honoring whatever
    # CODE_EXECUTOR_MODE / EVOLUTION_SANDBOX_MODE .env sets (default: subprocess).
    CODE_EXECUTOR_MODE: runner
    EVOLUTION_SANDBOX_MODE: runner
    RUNNER_URL: http://runner:8090
    # Replicated workers (deploy.replicas: 2 below) MUST each own a UNIQUE Redis
    # consumer name or they share one pending-entries list and break XAUTOCLAIM
    # crash-recovery. Forcing WORKER_CONSUMER_NAME empty here makes every worker
    # auto-derive worker-{hostname}-{pid} regardless of what .env sets — the
    # canonic example-config default (worker-1) would otherwise make BOTH
    # replicas collide on it. Harmless for the api/agent roles (they don't read
    # it). See src/worker/__main__.py:_resolve_consumer_name.
    WORKER_CONSUMER_NAME: ""
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    searxng:
      condition: service_started
    meilisearch:
      condition: service_healthy
    # Phase 3b/c: code-exec roles route generated code to the runner; waiting for
    # it healthy avoids a first-code-exec host-subprocess fallback at startup.
    runner:
      condition: service_healthy
  volumes:
    - turing-workspace:/home/turing/.turing
    - turing-logs:/home/turing/logs
  networks:
    - turing-net
  restart: unless-stopped
  # Defense-in-depth inherited by every agent role (api/worker/agent-cli). The
  # worker runs LLM-driven code (via the isolated runner), so drop ALL Linux
  # capabilities + block privilege escalation. Per-role resource limits are set
  # on each service below (resource limits can't be shared via the anchor — a
  # service's own `deploy:` would shallow-replace the anchor's).
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: turing_agent
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5433:5432"
    volumes:
      # pg18+ uses version-specific data subdirs; mount the PARENT so future
      # major-version upgrades work via pg_upgrade (docker-library/postgres#1259).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 1024
    security_opt:
      - no-new-privileges:true
    # No cap_drop:ALL here: the postgres official entrypoint chowns/chmods the
    # data dir + /var/run/postgresql as root before gosu→postgres, which needs
    # file-ownership caps (CHOWN/FOWNER/DAC_OVERRIDE). Dropping ALL makes it
    # loop "Operation not permitted" and never come up. no-new-privileges +
    # the resource limit still bound it, and postgres runs no untrusted code,
    # so cap_drop adds no real protection here. (Meili/rootless images DO
    # tolerate cap_drop:ALL; these root-then-gosu images do not.)
    networks:
      - turing-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # --maxmemory lowered 2g→1g so the container mem-limit (1.5g below) sits
    # ABOVE the data cap with real headroom — redis self-limits at 1g (LRU), so
    # it is never OOM-killed and never evicts an unacked turing:runs stream entry
    # (which would lose a pending job). 1g is ample for this app's hot/cache tier.
    command: redis-server --appendonly yes --maxmemory 1g --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1500m
          cpus: "1.0"
          pids: 1024
    security_opt:
      - no-new-privileges:true
    # No cap_drop:ALL here: the redis official entrypoint chowns the AOF/data
    # dir as root before gosu→redis, which needs file-ownership caps (CHOWN/
    # FOWNER/DAC_OVERRIDE). Dropping ALL makes it loop "Permission denied" on
    # ./appendonlydir. no-new-privileges + the resource limit bound it; redis
    # executes no untrusted code so cap_drop adds no real protection. See the
    # matching note on the postgres service for the same root-then-gosu reason.
    networks:
      - turing-net
    restart: unless-stopped

  searxng:
    # Primary keyless live-search service (Phase 1). JSON API enabled + bot
    # limiter disabled in the mounted settings.yml so the agent can call
    # /search?format=json over the internal network without keys.
    # NOTE: the service still listens on 8080 INSIDE the container (the
    # in-container agent reaches it at http://searxng:8080); the HOST port is
    # mapped to 8081 so this stack never clashes with SearXNG containers other
    # projects may run on the default 8080.
    # Pinned by immutable digest (not :latest): SearXNG publishes only rolling
    # :latest + weekly date tags, so a tag still floats. The digest freezes the
    # EXACT image already pulled locally (no re-pull, no behavior change). Bump
    # intentionally by pulling a new digest + updating this string.
    image: searxng/searxng@sha256:754a07a64e926a1fc0a8a30cd7a07d08278188f0ef6143e38ad0b22ea8599c55
    ports:
      - "8081:8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
          pids: 1024
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - turing-net
    restart: unless-stopped

  meilisearch:
    # Corpus keyword/hybrid index (Phase 1). BM25 + filterable attrs; the
    # agent's corpus_search fuses these hits with pgvector semantic hits via
    # Reciprocal Rank Fusion. Master key from .env (MEILISEARCH_KEY).
    # NOTE: the service listens on 7700 INSIDE the container (the in-container
    # agent reaches it at http://meilisearch:7700); the HOST port is mapped to
    # 7701 so this stack never clashes with Meilisearch containers other
    # projects may run on the default 7700.
    image: getmeili/meilisearch:v1.12
    command: ["meilisearch", "--http-addr", "0.0.0.0:7700"]
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      # Empty/unset MEILISEARCH_KEY → no master key → keyless dev (matches the
      # agent's empty default). Production sets MEILISEARCH_KEY (>=16 bytes) in
      # .env; Meili then requires it and the agent sends the same value.
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7701:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - turing-net
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 1024
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # ─── Phase 3 role-split ───────────────────────────────────────────────
  # Stateless roles scale; stateful services (postgres/redis/searxng/meili)
  # don't. `api` (FastAPI ingress) enqueues RunJobs to the turing:runs stream;
  # `worker`(s) drain it via the consumer group and run the LangGraph + evolution
  # loop. Both reuse the single Dockerfile image, differing only in `command`.
  api:
    <<: *agent-common
    # uvicorn factory (src/api/app.py:create_app). The Dockerfile CMD (CLI) is
    # stale for the API role; run the server directly.
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "src.api.app:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    # HOST port 8800 (not the default 8000): 8000 is a magnet for conflicts with
    # other dev apps (another project's API already collided on it during
    # bring-up). The non-default host port matches the stack's pattern
    # (5433/6380/8081/7701 all avoid the canonic port). The container still
    # LISTENS on 8000 internally (uvicorn --port 8000 above); only the HOST side
    # of the mapping is non-8000, so nothing in-container references 8000 as a host.
    ports:
      - "8800:8000"
    healthcheck:
      # Liveness probe against the root-mounted /health route
      # (src/api/routes/health.py). start_period covers uvicorn + app startup
      # (DB pool warm-up) before the first probe; mirrors the runner healthcheck.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
          pids: 512

  worker:
    <<: *agent-common
    # NO container_name: deploy.replicas spawns N containers and a fixed name
    # would collide. Each replica auto-derives a UNIQUE Redis consumer name
    # (worker-{hostname}-{pid}, src/worker/__main__.py) so replicas don't share a
    # pending-entries list — XAUTOCLAIM crash-recovery stays sound at scale.
    command: ["python", "-m", "src.worker"]
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 512
    # Graceful drain: SIGTERM sets the stop flag; an in-flight job finishes +
    # XACKs before the loop exits. A run longer than this grace is hard-killed,
    # which is SAFE — its checkpoint is durable, so the next worker claim
    # resumes from it (thread_id = api-{run_id} is stable across redelivery).
    stop_grace_period: 120s
    volumes:
      # Same persisted workspace/logs as the api (+ agent-cli) so deliverables a
      # worker writes survive restarts and are visible to the api (explicit list
      # replaces the anchor's volumes, so both are re-declared here). The worker
      # no longer mounts docker.sock — generated code now runs in the remote
      # no-DinD runner (Phase 3b/c), reached over turing-runner-net.
      - turing-workspace:/home/turing/.turing
      - turing-logs:/home/turing/logs
    networks:
      # turing-net for postgres/redis/searxng/meili/api; turing-runner-net to
      # reach the no-DinD code-exec runner (worker has NO Docker socket).
      - turing-net
      - turing-runner-net

  # ─── Phase 3b/c — remote no-DinD code-execution runner (#218/#219) ──────
  # The worker's single sink for generated code: both code_executor (untrusted
  # LLM one-off code) and the evolution sandbox (statically vetted code) POST
  # here over HTTP. The worker needs NO Docker socket (no Docker-in-Docker) — the
  # disposable container itself is the isolation boundary (per-invocation
  # gVisor/Kata hardening is a Phase-5 doc item).
  #
  # LEAST-PRIVILEGE: NO env_file, NO DATABASE_URL / REDIS_URL / search keys — it
  # reads only RUNNER_* env (its results dir + timeout cap). NO internet egress:
  # it lives on the internal-only turing-runner-net. :8090 is exposed to the
  # internal network only (NOT mapped to a host port).
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    image: turing-runner:latest
    environment:
      RUNNER_RESULTS_ROOT: /home/turing/.turing/results
      RUNNER_MAX_TIMEOUT_S: "300"
      # RO rootfs (below): stop Python from trying to write .pyc to /app.
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      # Shared workspace RW so a script's results/<file> writes are visible to the
      # worker and land in the same persisted volume the worker/api read. logs for
      # symmetry. UID ALIGNMENT: both this image and the main Dockerfile create the
      # `turing` user via `useradd -m -r turing` from the same python:3.12-slim
      # base, so they resolve to the SAME uid and shared-volume writes interoperate
      # (a runtime uid-mismatch smoke is a Phase-5 hardening item).
      - turing-workspace:/home/turing/.turing
      - turing-logs:/home/turing/logs
    expose:
      - "8090"   # internal only — NOT mapped to a host port (no egress path)
    # Hardest target — this container EXECUTES untrusted LLM-generated Python,
    # so bound it tight: RO rootfs (writes only hit the writable /tmp tmpfs +
    # the shared results volume), 256 PIDs (fork-bomb cap), 1g mem / 1 cpu,
    # ALL capabilities dropped, no privilege escalation. /tmp is scratch for the
    # executed subprocess (script + tempfile.mkdtemp); the results volume holds
    # deliverables (cwd = results-root parent). read_only is safe because the
    # only rootfs writes would be pyc, suppressed by PYTHONDONTWRITEBYTECODE.
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /run:size=32m
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:8090/health\",timeout=2).read()'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - turing-runner-net
    restart: unless-stopped

  # The CLI-in-container path: one-off / smoke / manual runs via
  # `docker compose --profile cli run --rm agent --goal "..."`. Profile-gated so
  # `docker compose up -d` runs api+worker (the production path), not the
  # interactive monolith. Shares image + env via the anchor.
  agent:
    <<: *agent-common
    profiles: ["cli"]
    networks:
      # CLI smoke runs inherit CODE_EXECUTOR_MODE=runner from the anchor and route
      # code-exec through the runner too, so reach it on turing-runner-net.
      - turing-net
      - turing-runner-net
    # Inherits the Dockerfile CMD (python main.py --interactive); extra args
    # pass through on `docker compose --profile cli run agent --goal "..."`.
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 512

  # Phase 2c — the code_executor sandbox image (NOT a running service). Gated
  # behind the `sandbox` profile so it never starts with the default stack; an
  # operator builds it on demand to opt into CODE_EXECUTOR_MODE=docker:
  #   docker compose --profile sandbox build toolbox
  toolbox:
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: Dockerfile.toolbox
    image: turing-toolbox:latest

volumes:
  pgdata:
  redisdata:
  meilidata:
  turing-workspace:
  turing-logs:

networks:
  turing-net:
    driver: bridge
  # Phase 3b/c — runner-only, internal (NO internet egress). Only the worker,
  # agent-cli, and runner attach here; the runner has NO other network, so it is
  # fully egress-isolated from the internet (postgres/redis/searxng/meili stay on
  # turing-net, which the runner is NOT on).
  turing-runner-net:
    driver: bridge
    internal: true
