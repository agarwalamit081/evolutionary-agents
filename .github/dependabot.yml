# Dependabot configuration.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Security alerts + security-update PRs are enabled at the repo level (no file
# needed for those). This file ADDS scheduled *version* updates so non-vulnerable
# deps are kept current, with conventional-commit prefixes and grouped PRs.
#
# Sensitive pins are ignored so auto-bumps can't re-break hard-won resolutions:
#   - litellm  : installed --no-deps + explicit fastuuid pin (dependency clash)
#   - dspy     : pinned to ==2.6.27 (retires the gepa backend)
# Docker *major* bumps are ignored: pgvector pg18 (Postgres major = data-format
# change) and redis 7-alpine must not auto-jump a major version.
version: 2
updates:
  # --- Python dependencies (requirements.txt + requirements.optimizer.txt) ---
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      python-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "litellm"
      - dependency-name: "dspy"
      - dependency-name: "dspy-ai"
      - dependency-name: "fastuuid"
    labels:
      - "dependencies"

  # --- Dockerfile base images (Dockerfile.runner / .optimizer / .toolbox) ---
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 5
    ignore:
      - update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"

  # --- docker-compose.yml image tags (pgvector, redis, etc.) ---
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 5
    ignore:
      - update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
